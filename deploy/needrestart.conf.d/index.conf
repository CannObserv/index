# #2: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# libc6 security update would then restart containerd and docker mid-apply,
# and qdrant.service and ollama.service with them (Requires=docker.service):
# cohort search down outside an approved window. With the key set, needrestart
# prints "Disabling Ubuntu mode, explicit restart mode configured" and only
# lists. Shape from CannObserv/notifier#91.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
