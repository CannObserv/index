[project]
name = "co-index"
version = "0.1.0"
description = "Deploy surface and operator tooling for co-index, the cohort's shared SocratiCode store (Qdrant + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
# Nothing here is a Python package: the host runs shell and systemd units, and
# the tests drive them as subprocesses. The dependencies are the tools only.
dependencies = []

[tool.uv]
package = false
# A floor, never a pin (#25). An older uv fails here with a clear message
# instead of rewriting uv.lock (revision 5, written by 0.13.5). CI's setup-uv
# reads it too and installs the newest uv that meets it. Dependabot's uv
# updater enforces it as well, and runs 0.13.5 (dependabot-core uv/Dockerfile,
# 2026-11-01): raise the floor past that and every dev-tools PR fails, in
# Dependabot's tab only. Guarded by tests/ci/test_uv_source.py.
required-version = ">=0.13.5"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.16.5,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Keep only a failed run's basetemp, and one at most (#16, the disk GC's repo-knobs.md).
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py312"
# skills-vendor/ is upstream code, linted upstream. docs/plans/ are dated snapshots of what was proposed, not maintained source;
# reformatting their code samples rewrites the record.
extend-exclude = ["docs/plans/", "skills-vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

# tests/ci/test_dependabot.py is a copy of adopting-dependabot's asset, edited
# only in its ADAPT block so it diffs cleanly against the skill's next
# version. Upstream formats at 88 and two of its lines pass 100: lint it, but
# leave its layout alone.
[tool.ruff.lint.per-file-ignores]
"tests/ci/test_dependabot.py" = ["E501"]

[tool.ruff.format]
exclude = ["tests/ci/test_dependabot.py"]
